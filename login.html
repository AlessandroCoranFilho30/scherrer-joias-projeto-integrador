<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scherrer Joias</title>
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="cabecalho-cadastro">
    <a href="index.html">
    <img src="img/logo.png" height="80px" width="130px">
    </a>
    </div>

    <form action="" method="post">
        <h1>Acesse sua conta</h1>
        <div class="info">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="exemplo@mail.com" required>
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha aqui" required>
        </div>

        <button type="submit">Entrar</button>
        <br>
        <p>Não tem uma conta? <a href="cadastro.html">Cadastro</a></p>
    </form>
</body>
</html>
