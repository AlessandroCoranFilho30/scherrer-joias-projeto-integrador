<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scherrer Joias</title>
    <link rel="stylesheet" href="css/categorias.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <a href="index.html"><img class="logo" src="img/logo.png" alt="Scherrer Joias logo" width="90" height="90"></a>
        <div class="pesquisa">
            <input type="search" placeholder="Pesquisar" aria-label="Pesquisar produtos">
        </div>

        <div class="perfil-e-carrinho">
            <a href="cadastro.html">
                <img src="img/profile.svg" alt="Perfil do usuário" width="32" height="32">
            </a>
            <img src="img/bag.svg" alt="Carrinho de compras" width="32" height="32">
        </div>
    </header>

    <div class="menu">
        <div class="item">
            <a href="brincos.html">Brincos</a>
            <a href="aneis.html">Anéis</a>
            <a href="pulseiras.html">Pulseiras</a>
            <a href="chokers.html">Chockers</a>
        </div>
    </div>

    <main>
        <div class="mais-vendidos-container">
            <div class="mais-vendidos-cards">
                <img src="img/bracelete2.jpeg" alt="Imagem do Bracelete" width="300" height="300">
                    <hr>
                    <br>
                    <p>Bracelete Tubo Eliptico Articulado</p>
                    <p>R$ 23,00</p>
                    <div class="botao">
                    <a href="Pulseira1.html">
                    <button>Comprar</button>
                    </a>
                    </div>
            </div>

            <div class="mais-vendidos-cards">
                <img src="img/bracelete3promo.jpeg" alt="Imagem do Bracelete" width="300" height="300">
                    <hr>
                    <br>
                    <p>Bracelete de Tubo de Encaixe</p>
                    <p>R$ 29,00</p>
                    <div class="botao">
                    <a href="Pulseira2.html">
                    <button>Comprar</button>
                    </a>
                    </div>
            </div>

        </div>
    </main>


    <footer>
        <div class="text">
            <p class="txt">FORMAS DE PAGAMENTO</p>
            <p class="txt">SELOS DE SEGURANÇA</p>
        </div>
        <div class="cards">
            <div class="pay">
                <img src="img/visa.png" alt="Visa" width="60" height="40">
                <img src="img/mastercard.svg" alt="Mastercard" width="60" height="40">
                <img src="img/elo.png" alt="Elo" width="60" height="40">
                <img src="img/pix.webp" alt="Pix" width="60" height="40">
            </div>
            <div class="security">
                <img src="img/reclameaqui.jpg" alt="Reclame Aqui" width="60" height="60">
                <img src="img/alphassl.jpg" alt="Alpha SSL" width="60" height="60">
                <img src="img/google.jpg" alt="Google" width="60" height="60">
            </div>
        </div>
    </footer>
</body>

</html>
