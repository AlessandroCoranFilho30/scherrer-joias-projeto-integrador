<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="x-icon" type="image/png" href="img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scherrer Joias</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <img class="logo" src="img/logo.png" alt="logo">
        <div class="pesquisa">
            <input type="search" placeholder="Pesquisar">
        </div>

        <img src="img/profile.svg" alt="profile">
        <img src="img/bag.svg" alt="bag">
    </header>

    <div class="menu">
        <div class="item">
            <a href="">Brincos</a>
            <a href="">Anéis</a>
            <a href="pulseira.html">Pulseiras</a>
            <a href="">Chockers</a>
        </div>
    </div>

    <main>
        <div class="banner">
            <img src="img/chevron-left.png" height="20%">
            <div class="imagembanner">
                <img src="img/banner.png" alt="banner">
            </div>
            <img src="img/chevron-right.png" height="20%">
        </div>


        <div class="destaque">
            <h1>DESTAQUES</h1>
            <p>Categorias em Destaque</p>

            <div class="container-destaque">
                <div class="destaque-cards">
                    <img src="img/brinco.jpg" alt="Brincos">
                    <h2>Brinco</h2>
                </div>

                <div class="destaque-cards">
                    <img src="img/anel.jpg" alt="Aneis">
                    <h2>Aneís</h2>
                </div>

                <div class="destaque-cards">
                    <img src="img/pulseira.jpg" alt="Pulseiras">
                    <h2>Pulseiras</h2>
                </div>

                <div class="destaque-cards">
                    <img src="img/Chocker.jpg" alt="Chockers">
                    <h2>Chokers</h2>
                </div>
            </div>
        </div>

        <div class="imagens">
            <img src="img/colar-destaque.png" alt="colar-destaque">
            <img src="img/pulseira-destaque.png" alt="pulseira-destaque">
            <img src="img/brinco-destaque.png" alt="brinco-destaque">
        </div>

    </main>


    <footer>
        <div class="text">
            <p class="txt">FORMAS DE PAGAMENTO</p>
            <p class="txt">SELOS DE SEGURANÇA</p>
        </div>
        <div class="cards">
            <div class="pay">
                <img src="img/visa.png" alt="visa">
                <img src="img/mastercard.svg" alt="mastercard">
                <img src="img/elo.png" alt="elo">
                <img src="img/pix.webp" alt="pix">
            </div>
            <div class="security">
                <img src="img/reclameaqui.jpg" alt="reclame aqui">
                <img src="img/alphassl.jpg" alt="alphassl">
                <img src="img/google.jpg" alt="google">
            </div>
        </div>
    </footer>
</body>

</html>
